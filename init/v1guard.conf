#!upstart
description "V1TAL keep-alive map guard"

# v1guard snapshots a good map and sidecar, and restores them together if the
# nav clears the map. A user reset_map clears the snapshot too. Rotation is
# detected but never overwritten by default.

start on started rrwatchdoge
stop on runlevel [06]

oom score 1000

env V1SEG_KIT=/mnt/data/rockrobo/rrtest
env PERSIST_ROOT=/mnt/data/rockrobo

respawn
respawn limit 10 90
# A clean exit 0 or SIGTERM is normal; other signals and failures respawn.
normal exit 0 TERM

script
    # Same cwd and PATH shape as rrwatchdoge.conf.
    chdir /mnt/data/rockrobo
    PATH=$PATH:/opt/rockrobo/rrlog:/opt/rockrobo/cleaner/bin:/opt/rockrobo/wlan:/opt/rockrobo/watchdog:/opt/rockrobo/miio:/opt/rockrobo/firmware
    # --quiet keeps routine polling out of the flash-backed upstart log.
    exec "$V1SEG_KIT/v1guard" \
        --data-dir /mnt/data/rockrobo \
        --watcher \
        --quiet \
        --on-rotate hold
end script
