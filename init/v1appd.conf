#!upstart
description "V1TAL segment producer + one-shot AppProxy decision"

# v1appd drives v1seg and makes one AppProxy decision at startup: adopt a
# preloaded instance, launch one, or leave a stock instance alone. Opt into
# resident supervision with --supervise-appproxy on the exec line.

start on started rrwatchdoge
stop on runlevel [06]

# Keep background work behind nav/Valetudo in the OOM line.
oom score 1000

env V1SEG_KIT=/mnt/data/rockrobo/rrtest

# Mirror the stock rrwatchdoge environment so a relaunched AppProxy sees the
# same paths and configuration as the one WatchDoge starts.
env RR_ROOT=/opt/rockrobo
env RR_UDATA=/mnt/data
env RR_DEFAULT=/mnt/default
env RR_RESERVE=/mnt/reserve

env WIFI_START_PATH=/opt/rockrobo/wlan
env WIFI_START_NAME=wifi_start.sh

env WIFI_CONF_PATH=/mnt/data/miio
env WIFI_CONF_NAME=wifi.conf

env WIFI_ENABLE_PATH=/mnt/data/wlan
env WIFI_ENABLE_NAME=wifi_enable.conf

env MIIO_RECV_LINE=miio_recv_line
env MIIO_SEND_LINE=miio_send_line

env NAV_CONFIG_PATH=/opt/rockrobo/cleaner/conf
env NAV_DYNAMIC_CONFIG_PATH=/mnt/data/rockrobo
env NAV_LOG_PATH=/mnt/data/rockrobo

env UPDPKG_DIR=/mnt/data/.temp
env UPDPKG_INFO_PATH=/mnt/data/.temp
env UPDPKG_INFO_NAME=Update.pkg.inf

env HWDOG_OPTION=1
env CRASH_IGNORE_MIN=600

respawn
respawn limit 10 90
# A clean exit 0 or SIGTERM is normal; other signals and failures respawn.
normal exit 0 TERM

script
    # Same PATH and cwd as rrwatchdoge.conf.
    PATH=$PATH:$RR_ROOT/rrlog:$RR_ROOT/cleaner/bin:$RR_ROOT/wlan:$RR_ROOT/watchdog:$RR_ROOT/miio:$RR_ROOT/firmware
    chdir $RR_ROOT

    # upstart does not expand variables in env stanzas; export it here so
    # v1appd and its producer inherit the model path.
    export ROOMSEG_MODEL="$V1SEG_KIT/roomseg.mdl"

    exec "$V1SEG_KIT/v1appd" \
        --producer "$V1SEG_KIT/v1seg" \
        --libdir   "$V1SEG_KIT/lib" \
        --shim     "$V1SEG_KIT/libv1seg_addon.so"
end script
